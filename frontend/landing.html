<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="tokens.css">
  <title>DOOTHING — 캠퍼스 크리에이터 드롭 아카이브</title>
  <meta name="description" content="우리 학교 크리에이터들의 한정 드롭 아카이브. 굿즈를 디자인하고, 크루와 공유하고, 세상에 하나뿐인 드롭을 오픈하세요.">
  <script>
    /* 앱(Capacitor)에서 루트로 열리면 마케팅 랜딩 대신 메인으로 즉시 이동. */
    (function () {
      try {
        if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
          location.replace('/main.html');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #0A0A0A; color: #FAFAFA; font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    .ld { min-height: 100dvh; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .ld__grid { position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(#141414 1px, transparent 1px), linear-gradient(90deg, #141414 1px, transparent 1px);
      background-size: 64px 64px; -webkit-mask-image: radial-gradient(circle at 50% 34%, #000 0%, transparent 78%);
      mask-image: radial-gradient(circle at 50% 34%, #000 0%, transparent 78%); opacity: .55; }

    .ld__nav { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; }
    .ld__logo { font-family: var(--font-street); font-size: 28px; letter-spacing: -1px; color: #fff; }
    .ld__navr { display: flex; align-items: center; gap: 6px; }
    .ld__link { font-size: 14px; font-weight: 700; color: #B5B5B5; padding: 10px 14px; border-radius: 999px; }
    .ld__link:hover { color: #fff; }
    .ld__cta { font-size: 14px; font-weight: 800; color: #0A0A0A; background: #fff; padding: 10px 18px; border-radius: 999px; }
    .ld__cta:hover { background: #E0E0E0; }

    .ld__hero { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px 24px 24px; }
    .ld__pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #B5B5B5; border: 1px solid #262626; border-radius: 999px; padding: 7px 14px; margin-bottom: 28px; }
    .ld__pill i { width: 6px; height: 6px; border-radius: 50%; background: #fff; display: inline-block; animation: pulse 1.8s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
    .ld__h1 { font-size: clamp(42px, 9vw, 98px); line-height: .97; font-weight: 900; letter-spacing: -2px; }
    .ld__h1 em { font-family: var(--font-street); font-style: normal; font-weight: 400; letter-spacing: -1px; display: block; }
    .ld__sub { margin-top: 26px; font-size: clamp(15px, 2.4vw, 18px); line-height: 1.65; color: #A3A3A3; max-width: 540px; }
    .ld__acts { margin-top: 36px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .ld__btn { height: 54px; padding: 0 30px; border-radius: 999px; font-size: 16px; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; letter-spacing: .3px; transition: transform .12s, background .15s, border-color .15s; }
    .ld__btn--fill { background: #fff; color: #0A0A0A; }
    .ld__btn--fill:hover { transform: translateY(-2px); }
    .ld__btn--line { background: transparent; color: #fff; border: 1.5px solid #3A3A3A; }
    .ld__btn--line:hover { border-color: #fff; }

    .ld__marquee { position: relative; z-index: 2; border-top: 1px solid #1A1A1A; padding: 18px 0; overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
    .ld__mtrack { display: inline-flex; gap: 40px; white-space: nowrap; animation: marq 26s linear infinite; }
    .ld__mtrack span { font-family: var(--font-street); font-size: 22px; color: #333; letter-spacing: -.5px; }
    .ld__mtrack span:nth-child(3n) { color: #fff; }
    @keyframes marq { from{transform:translateX(0)} to{transform:translateX(-50%)} }

    @media (max-width: 767px) {
      .ld__nav { padding: 16px 18px; }
      .ld__logo { font-size: 24px; }
      .ld__link { display: none; }
      .ld__acts { width: 100%; max-width: 340px; }
      .ld__btn { flex: 1; justify-content: center; padding: 0 18px; }
    }
    @media (prefers-reduced-motion: reduce) { .ld__mtrack, .ld__pill i { animation: none; } }
  </style>
</head>
<body class="dt-dark">
  <div class="ld">
    <div class="ld__grid" aria-hidden="true"></div>

    <nav class="ld__nav">
      <a href="/landing.html" class="ld__logo">DOOTHING</a>
      <div class="ld__navr">
        <a href="/main.html" class="ld__link">둘러보기</a>
        <a href="/board.html" class="ld__link">커뮤니티</a>
        <a href="/login.html" class="ld__cta">시작하기</a>
      </div>
    </nav>

    <main class="ld__hero">
      <span class="ld__pill"><i></i> CAMPUS CREATOR ARCHIVE</span>
      <h1 class="ld__h1">만들고, 입고,<em>DROP IT.</em></h1>
      <p class="ld__sub">우리 학교 크리에이터들의 한정 드롭 아카이브. 굿즈를 디자인하고, 크루와 공유하고, 세상에 하나뿐인 드롭을 오픈하세요.</p>
      <div class="ld__acts">
        <a href="/main.html" class="ld__btn ld__btn--fill">GET DROP →</a>
        <a href="/login.html" class="ld__btn ld__btn--line">로그인</a>
      </div>
    </main>

    <div class="ld__marquee" aria-hidden="true">
      <div class="ld__mtrack">
        <span>STREET</span><span>후드</span><span>DROP</span><span>키링</span><span>에코백</span><span>CREW</span>
        <span>아우터</span><span>LOOKBOOK</span><span>스티커</span><span>텀블러</span><span>ARCHIVE</span><span>과잠</span>
        <span>STREET</span><span>후드</span><span>DROP</span><span>키링</span><span>에코백</span><span>CREW</span>
        <span>아우터</span><span>LOOKBOOK</span><span>스티커</span><span>텀블러</span><span>ARCHIVE</span><span>과잠</span>
      </div>
    </div>
  </div>
</body>
</html>
